# Forever AH tracker settings. Secrets (Blizzard client id/secret) are NOT here:
# they live in GitHub -> Settings -> Secrets as BNET_CLIENT_ID and BNET_CLIENT_SECRET.

[auction_house]
region   = "eu"
ruleset  = 2      # 1 PvP, 2 Normal, 3 Roleplay, 15 Roleplay PvP
house_id = 114    # Horde, Normal ruleset. Confirmed 2026-11-18 against in-game prices
                  # (Peacebloom, Arcanite Bar, Black Lotus). Other EU Horde houses: 113, 115, 120, 124.
locale   = "en_GB"

[dashboard]
featured = "Fishing"   # this category is shown first, at the top of the page

[materials]
