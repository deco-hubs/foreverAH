# Forever AH tracker settings. Secrets (Blizzard client id/secret) are NOT here:
# they live in GitHub -> Settings -> Secrets as BNET_CLIENT_ID and BNET_CLIENT_SECRET.

[auction_house]
region   = "eu"
ruleset  = 2      # 1 PvP, 2 Normal, 3 Roleplay, 15 Roleplay PvP
house_id = 114    # Horde, Normal ruleset. Confirmed 2026-11-18 against in-game prices
                  # (Peacebloom, Arcanite Bar, Black Lotus). Other EU Horde houses: 113, 115, 120, 124.
locale   = "en_GB"

[dashboard]
featured = "Fishing"   # summarised "at a glance" on the Trends tab
tab_order = ["Crafting", "Investments", "Ores and bars", "Fishing", "Pearls", "Herbs", "Raid prep"]   # tabs not listed follow after, then Trends
timezone = "Europe/Oslo"   # for the "best time to buy" chart

[trends]
min_change = 10        # % move over 7 or 30 days to count as trending
min_steadiness = 0.6   # 0-1 (R²): how consistently it moved; lower = more items flagged, more false alarms
max_noise = 0.10       # items jumping more than this between snapshots are "erratic" and never flagged

