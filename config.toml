# ---------------------------------------------------------------------------
# Crafting profit (optional). Empty = the section is hidden from the dashboard.
# To bring it back, add [[recipe]] blocks like this one (remove the # marks):
#
# [[recipe]]
# name = "Stonescale Oil"
# makes = 13423
# makes_qty = 1
# reagents = [ { id = 13422, qty = 1 }, { id = 3371, qty = 1, vendor_price = 4 } ]   # eel + Empty Vial
#
# Every auction house item in a recipe must also be in the [materials] list.
# Vendor items take vendor_price in copper. Profit = sale value after the 5% AH cut minus cost.
# ---------------------------------------------------------------------------
