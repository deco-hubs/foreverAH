# ---------------------------------------------------------------------------
# Investments tab (written 2026-11-24). You write the reasons; the dashboard works out
# the numbers and a signal on every run. Each id must also be in [materials].
#   catalyst  = name of a [[catalyst]] below (the event you're waiting for)
#   horizon   = "short" (weeks) or "long" (months)
#   bought_qty / bought_at = fill in when you buy, e.g. bought_qty = 200, bought_at = "12s 50c"
# ---------------------------------------------------------------------------

[[catalyst]]
date = 2026-12-09
name = "Raids open"
note = "Barrow Deeps (10), Hyjal Summit (20), Onyxia's Lair (40). Fixed date on Blizzard's roadmap."

[[catalyst]]
date = 2027-01-15
name = "Hardcore servers (no date yet)"
note = "Blizzard says winter. Placeholder date: move it when it's announced. Separate economy, so mostly a population shift."

[[catalyst]]
date = 2027-04-01
name = "Spring update (no date yet)"
note = "2 new raids (10 and 20), 2 dungeons, new zone, a legendary questline. Placeholder date."

[[investment]]
id = 13464   # Golden Sansam
horizon = "short"
catalyst = "Raids open"
thesis = "9 per Flask of Natural Accuracy (the new +hit flask for Hyjal Summit and Barrow Deeps), and every raider who flasks needs one a week. Price has drifted down since launch while supply grows, the opposite of what raid demand should do from 9 December."
later_use = "Natural flasks only work in Mount Hyjal and its two raids, so demand lasts as long as those raids are current. Also used in Major Rejuvenation Potions."
risk = "Many level 60s are herbing now; supply could keep outpacing demand. Sell into the first raid weeks rather than hold for months."

[[investment]]
id = 13465   # Mountain Silversage
horizon = "short"
catalyst = "Raids open"
thesis = "6 per Flask of Natural Aggression (+crit in Hyjal), and a reagent in the Classic flasks Supreme Power and Chromatic Resistance and in Greater Arcane Elixir. Cheap and flat today."
later_use = "Classic-style flasks and caster elixirs stay in use for every raid tier, so it keeps a floor after the first rush."
risk = "Supply is rising (about +16% units listed over the week)."

[[investment]]
id = 13463   # Dreamfoil
horizon = "short"
catalyst = "Raids open"
thesis = "The busiest raid herb: 9 per Flask of Natural Precision, plus Greater Fire Protection Potions (Elemental Fire + Dreamfoil) for Onyxia, Major Mana Potions and Greater Arcane Elixirs. US guides already call it a buy before 9 December."
later_use = "Used in Flask of Supreme Power and Distilled Wisdom, so demand continues after the Hyjal raids are on farm."
risk = "The most-farmed high-level herb, so the spike may be short."

[[investment]]
id = 13467   # Icecap
horizon = "short"
catalyst = "Raids open"
thesis = "6 per Flask of Natural Swiftness (+haste in Hyjal), plus Major Mana Potions and the Classic flasks Distilled Wisdom and Chromatic Resistance."
later_use = "Classic pattern: frost-resistance gear and potions matter for later raids, if Forever brings a frost-themed raid back."
risk = "Only grows in Winterspring, so supply is thinner and swings harder both ways."

[[investment]]
id = 248822  # Death Lotus
horizon = "long"
catalyst = "Raids open"
thesis = "The bottleneck of all four Natural flasks (1 each), the Lotus Claw and Natural Power glove enchants, and the Legionite Glaive. The only known source is a small chance from Hyjal herbs with the Lotus Claw enchant, so it should behave like Black Lotus."
later_use = "Every raider using a Natural flask needs one per raid night, so demand is weekly and recurring."
risk = "Not seen on our auction house yet. Watch the first listings: early prices on rare new mats tend to start high and fall as more herbalists get the enchant."

[[investment]]
id = 248821  # Demonsage
horizon = "short"
catalyst = "Raids open"
thesis = "12 per Flask of Natural Accuracy and 18 per Natural Aggression, the two most popular Hyjal flasks for damage dealers."
later_use = "Only used in those flasks, so its value lives and dies with the Hyjal raids."
risk = "Node locations weren't public at launch; once herbalists know where it grows, supply may jump."

[[investment]]
id = 248823  # Marefoil
horizon = "short"
catalyst = "Raids open"
thesis = "12 per Flask of Natural Precision and 18 per Natural Swiftness, plus the Stealthman 52 engineering item."
later_use = "Same as Demonsage: tied to the Hyjal raids."
risk = "Same as Demonsage."

[[investment]]
id = 13468   # Black Lotus
horizon = "long"
catalyst = "Spring update (no date yet)"
thesis = "One in every Classic-style flask (Titans, Supreme Power, Distilled Wisdom, Chromatic Resistance). Here it is about 8g; on Classic Anniversary realms it later reached about 250g each as raiding got harder and gold inflated."
later_use = "Demand grows with every raid tier, because harder raids mean more flasking. The classic long-term hold."
risk = "Forever adds herb seeds and a Greenhouse, which may make it less scarce than in Classic. Buy small amounts in the cheap hours."

[[investment]]
id = 7068    # Elemental Fire
horizon = "short"
catalyst = "Raids open"
thesis = "With Dreamfoil it makes the Greater Fire Protection Potion, the standard answer to Onyxia's Deep Breath, and Blizzard told players to build fire resistance before Onyxia. Also used for the cloak fire-resistance enchant."
later_use = "In Classic, one of the most farmed items all the way through the fire raids. Depends on whether Forever brings back Molten Core or Blackwing Lair."
risk = "Onyxia alone is a smaller fire market than Molten Core was. Not tracked before today, so the range starts now."

[[investment]]
id = 13422   # Stonescale Eel (your position)
horizon = "short"
catalyst = "Raids open"
bought_qty = 1000
bought_at = "1s"
thesis = "Your own buy. The eel becomes Stonescale Oil, which goes into Flask of the Titans (the tank flask), so demand should pick up when raids open on 9 December. Already up from about 1s 40c to 1s 70c–2s since tracking began."
later_use = "Tanks flask for every raid tier. Right now the eel sells for slightly more than the oil, so sell eels as they are rather than turning them into oil."
risk = "Everyone fishes it: thousands are listed most of the day. Selling 1 000 at once would push the price down, so sell in small stacks in the expensive hours (around 11:00–14:00)."

[[investment]]
id = 13423   # Stonescale Oil
horizon = "long"
catalyst = "Raids open"
thesis = "Fishing pick: the oil goes into Flask of the Titans, the tank flask. Right now Stonescale Oil sells for less than a raw Stonescale Eel, so buy the oil, not the eel."
later_use = "Tanks flask for every raid, and the Elixir of Superior Defense uses it if that recipe comes to Forever."
risk = "Thousands listed at any time, from everyone fishing; it needs real flask demand to move."

[[investment]]
id = 8846    # Gromsblood
horizon = "short"
catalyst = "Raids open"
thesis = "The main herb in Flask of the Titans, and used in Elixir of the Mongoose (melee agility). Already up about 17% this week, so raid buyers may be early."
later_use = "Mongoose is used by every melee class in every tier."
risk = "Has already moved; may be pricey by the time you buy."

[[investment]]
id = 13893   # Large Raw Mightfish
horizon = "short"
catalyst = "Raids open"
thesis = "Fishing pick: cooks into Mightfish Steak, a raid food. It has fallen about a third since we started tracking, while other raid fish (Winter Squid, Nightfin Snapper) have already doubled."
later_use = "Raid food is eaten every raid night by everyone, in every tier."
risk = "Food buffs are the easiest to swap for something cheaper, so demand is softer than for flasks."

[[investment]]
id = 13755   # Winter Squid
horizon = "short"
catalyst = "Raids open"
thesis = "Fishing pick: Grilled Squid is a popular agility/crit raid food. Already up about 150% this week, so this is one to sell into rather than buy."
later_use = "Steady raid food demand; Winter Squid is only caught in winter months in Classic, which can squeeze supply."
risk = "Bought late = buying the top."

[[investment]]
id = 12360   # Arcanite Bar
horizon = "long"
catalyst = "Spring update (no date yet)"
thesis = "Made by a daily alchemy transmute from Arcane Crystal + Thorium Bar, so supply can't jump quickly. Used in endgame blacksmithing, engineering and leatherworking items."
later_use = "In Classic, Arcanite demand grew with every phase as new recipes (rep rewards, raid patterns) called for it."
risk = "About 47g a bar ties up a lot of gold, and the US price has been flat. Hold only what you can afford to sit on."

