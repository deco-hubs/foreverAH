# Forever AH tracker settings. Secrets (Blizzard client id/secret) are NOT here:
# they live in GitHub -> Settings -> Secrets as BNET_CLIENT_ID and BNET_CLIENT_SECRET.

[auction_house]
region   = "eu"
ruleset  = 2      # 1 PvP, 2 Normal, 3 Roleplay, 15 Roleplay PvP
house_id = 114    # Horde. UNCONFIRMED for the Normal ruleset: run the "houses" command once and
                  # compare a price you can see in game. EU Horde candidates: 113, 114, 115, 120, 124.
locale   = "en_GB"

