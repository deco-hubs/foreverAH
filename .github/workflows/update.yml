name: Update auction prices

on:
  schedule:
    - cron: "8,28,48 * * * *"   # every 20 minutes. Blizzard publishes about once an hour and GitHub often
                                  # starts scheduled jobs late, so checking 3 times an hour avoids missed snapshots.
                                  # Runs that find no new snapshot only rebuild the page (and usually commit nothing).
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      command:
        description: "fetch = normal update · houses = list all auction houses · report = rebuild the page only"
        default: fetch
        type: choice
        options: [fetch, houses, report]

permissions:
  contents: write                # lets the job commit the new prices back to the repository

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: python -m ah ${{ inputs.command || 'fetch' }}

      - name: Save new prices and dashboard
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Prices $(date -u +'%Y-%m-%d %H:%M') UTC"
            # If someone pushed a change (e.g. to config.toml) while this run was going,
            # rebase onto it before pushing instead of failing.
            for attempt in 1 2 3; do
              git pull --rebase --quiet origin main && git push && break
              sleep 5
            done
          fi
